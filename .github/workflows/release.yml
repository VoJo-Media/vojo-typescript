name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  # npm trusted publishing: npm exchanges this OIDC token, so no npm token is stored.
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `npm stage publish` needs npm 11.15.0 or newer.
      - run: npm install -g npm@11.21.3
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check:generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The trusted publisher may only stage: a maintainer approves the
      # release on npmjs.com (or `npm stage approve <id>`) with 2FA.
      - run: npm stage publish .
