name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  # npm trusted publishing: npm exchanges this OIDC token, so no npm token is stored.
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.6.2
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check:generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish
